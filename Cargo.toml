[package]
name = "sing-box-ser-mini"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Minimal HY2, SSH, and VLESS server with a Rust WebUI"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
blake2 = "0.10"
bytes = "1.12"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
getrandom = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.3"
mime_guess = "2.0"
percent-encoding = "2.3"
quinn = "0.11.9"
quinn-proto = "0.11.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = "0.23.32"
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = "0.6"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
