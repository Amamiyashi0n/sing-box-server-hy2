listen = "[::]:443"

[tls]
certificate = "/workspace/certs/fullchain.pem"
private_key = "/workspace/certs/privkey.pem"

[[users]]
name = "example"
password = "replace-with-a-long-random-password"

[bandwidth]
up_mbps = 100
down_mbps = 100
ignore_client_bandwidth = false

[udp]
enabled = true
timeout_secs = 300

