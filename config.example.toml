listen = "[::]:443"

[tls]
certificate = "/workspace/certs/fullchain.pem"
private_key = "/workspace/certs/privkey.pem"

# Optional encrypted SSH proxy. The public TCP listen port is shared with VLESS;
# this backend must remain loopback-only.
# [ssh]
# enabled = true
# upstream = "127.0.0.1:51401"
# username = "singbox-proxy"
# private_key = """-----BEGIN OPENSSH PRIVATE KEY-----
# ...
# -----END OPENSSH PRIVATE KEY-----"""
# host_key = "" # optional pin; leave empty for broad Mihomo compatibility

[[users]]
name = "example"
password = "replace-with-a-long-random-password"

[bandwidth]
up_mbps = 100
down_mbps = 100
ignore_client_bandwidth = false

[udp]
enabled = true
timeout_secs = 300

[outbound]
mode = "prefer_ipv4" # prefer_ipv4, ipv4_only, or ipv6_only

# Optional metadata used to generate client sharing links in the WebUI.
# [share]
# server = "hy2.example.com"
# ipv6_server = "2001:db8::10"
# port = 443
# sni = "hy2.example.com"
# insecure = false
# rule_preset = "china" # china, minimal, balanced, or comprehensive
# ad_block = false
# whitelist = ["example.cn", "*.internal.example.cn"] # forced DIRECT
# blacklist = ["ads.example.com"] # forced REJECT

# Optional HTTP/3 response for unauthenticated/non-HY2 requests.
# [masquerade]
# type = "string"
# status_code = 200
# content = "hello"
# headers = { content-type = ["text/plain; charset=utf-8"] }
